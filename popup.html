<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>RoFilter by Apeira Studios</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <div class="header">
      <img src="https://static.wikia.nocookie.net/roblox/images/a/a6/Roblox_Logo_2022.svg" alt="Logo" class="logo"
        onerror="this.style.display='none'">
      <h2>RoFilter</h2>
    </div>

    <div class="input-group">
      <label for="threshold">Minimum Rating (%)</label>
      <input type="number" id="threshold" min="0" max="100" placeholder="e.g. 60">
    </div>

    <div class="input-group">
      <label for="minPlayers">Minimum Active Players</label>
      <input type="number" id="minPlayers" min="0" placeholder="e.g. 1000">
    </div>

    <div class="input-group">
      <label for="bannedWords">Banned Title Words (comma separated)</label>
      <input type="text" id="bannedWords" placeholder="e.g. anime, simulator">
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="removeSponsored">
      <label for="removeSponsored">Hide Sponsored Games</label>
    </div>

    <button id="saveBtn">Save and Apply</button>
    <div id="status"></div>

    <div style="text-align: center; margin-top: 10px; font-size: 11px; color: #888;">
      &copy; 2026 Apeira Studios
    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
